{% extends "base/base.html" %}
{% load i18n %}
{% load static %}

{% block title %}
    {% trans "درباره ما" %}
{% endblock %}


{% block content %}

<section class="mx-auto mt-6 mb-16 max-w-4xl px-4" dir="rtl">

    <!-- لوگو به‌جای عکس -->
    <div class="flex h-56 items-center justify-center rounded-2xl bg-[#55000f] md:h-80">
        <img src="{% static 'public/images/logo.png' %}" alt="{% trans 'کیان مهر' %}"
            class="h-32 w-auto object-contain md:h-48">
    </div>

    <!-- عنوان -->
    <h1 class="mt-10 text-3xl font-bold text-[#55000f] md:text-4xl">
        {% trans "درباره ما" %}
    </h1>

    <span class="mt-4 block h-px w-full bg-[#c9cccc]"></span>

    {% if about %}

        <!-- متن -->
        <div class="about-content mt-6 text-justify text-base leading-8 text-gray-700">
            {{ about.content|linebreaks }}
        </div>

    {% else %}

        <p class="mt-6 rounded-xl bg-gray-50 px-5 py-6 text-center text-sm text-gray-600">
            {% trans "No information available yet." %}
        </p>

    {% endif %}

</section>

{% endblock %}
