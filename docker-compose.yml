
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: website-app
    restart: unless-stopped
    working_dir: /app/src

    env_file:
      - ./src/.env

    environment:
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8080
      - --log-level
      - info
      - --workers
      - "4"
      - --threads
      - "2"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"

    expose:
      - "8080"

    volumes:
      - static_volume:/var/www/static
      - /opt/kianmehr-data/media:/var/www/media

    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/health/', headers={'X-Forwarded-Proto':'https'}), timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  django_q:
    build:
      context: .
      dockerfile: Dockerfile

    image: website-app
    restart: unless-stopped
    working_dir: /app/src

    env_file:
      - ./src/.env

    environment:
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"

    command:
      - python
      - manage.py
      - qcluster

    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kianmehr}
      POSTGRES_USER: ${POSTGRES_USER:-kianmehr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}

    volumes:
      - /opt/kianmehr-data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - /opt/kianmehr-data/redis:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/kianmehr-data/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
      - /opt/kianmehr-data/media:/var/www/media:ro

    depends_on:
      web:
        condition: service_healthy

volumes:
  static_volume:
